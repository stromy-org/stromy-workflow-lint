name: Verify public workflow lint action

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Positive native action control
        id: positive
        uses: ./
        with:
          root: fixtures/pass
          baseline: fixtures/pass/baseline.json
      - name: Positive exported checker control
        env:
          CHECKER_DIR: ${{ steps.positive.outputs.checker_dir }}
          TOOLS_DIR: ${{ steps.positive.outputs.tools_dir }}
        run: |
          test -f "$CHECKER_DIR/workflow_lint.py"
          test -x "$TOOLS_DIR/actionlint"
          test -x "$TOOLS_DIR/zizmor"
          export PATH="$TOOLS_DIR:$PATH"
          uv run --no-project --python 3.12 --with pyyaml==6.0.3 \
            python "$CHECKER_DIR/workflow_lint.py" \
            --root fixtures/pass --baseline fixtures/pass/baseline.json
      - name: Negative native action controls
        run: python3 tests/test_negative.py
      - name: Structural render delta controls
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.3 python tests/test_delta.py
